{{ if .IsNamedParams }}
{{ $srcBase := .Site.Params.postURL }}
{{ $img := partial "image-meta" (dict "baseURL" $srcBase "src" (.Get "src")) }}
{{ $srcType := replaceRE ".jpg" "jpeg" $img.ext | replaceRE "\\." "" }}
<picture>
    <source srcset="{{ $srcBase }}{{ $img.file }}{{ $img.ext }}" type="image/{{ $srcType }}">
    <img src="{{ $srcBase }}{{ $img.file }}{{ $img.ext }}" alt='{{ .Get "alt" }}' width='{{ $img.width }}'
        height='{{ $img.height }}' loading="lazy">
</picture>
{{ end }}
